<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Flash Pag</title>
  <link rel="stylesheet" href="/console/styles.css">
  <link rel="stylesheet" href="/console/product.css">
  <link rel="stylesheet" href="/console/product-v2.css">
  <link rel="stylesheet" href="/console/developer.css">
  <link rel="stylesheet" href="/console/product-v3.css">
  <link rel="stylesheet" href="/console/revolut-foundation.css">
  <link rel="stylesheet" href="/console/revolut-operations.css">
  <link rel="stylesheet" href="/console/revolut-workspace.css">
  <link rel="stylesheet" href="/console/revolut-structure.css">
</head>
<body>
  <main id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="brand-mark">F</div>
      <div class="login-copy">
        <h1>Flash Pag</h1>
        <p>Acesse sua operação Pix.</p>
      </div>
      <label><span>E-mail</span><input id="email" type="email" autocomplete="username" required></label>
      <label><span>Senha</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button id="login-submit" type="submit" class="primary-action full">Entrar</button>
      <div id="login-error" class="error"></div>
    </form>
  </main>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark small">F</div>
        <div><strong>Flash Pag</strong><span>Pix Gateway</span></div>
      </div>

      <nav>
        <div class="nav-group">
          <span class="nav-label">Visão geral</span>
          <button data-view="dashboard" class="active"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        </div>
        <div class="nav-group">
          <span class="nav-label">Operação</span>
          <button data-view="transactions"><span class="nav-icon">↕</span><span>Transações</span></button>
          <button data-view="transfers"><span class="nav-icon">→</span><span>Transferências</span></button>
          <button data-view="customers"><span class="nav-icon">○</span><span>Clientes</span></button>
        </div>
        <div class="nav-group">
          <span class="nav-label">Desenvolvedores</span>
          <button data-view="integrations"><span class="nav-icon">◇</span><span>Integrações</span></button>
          <button data-view="developer"><span class="nav-icon">{ }</span><span>API & Docs</span></button>
          <button data-view="webhooks"><span class="nav-icon">⌁</span><span>Webhooks</span></button>
        </div>
        <div class="nav-group">
          <span class="nav-label">Estrutura</span>
          <button data-view="accounts"><span class="nav-icon">▣</span><span>Contas</span></button>
          <button data-view="organizations"><span class="nav-icon">◎</span><span>Organizações</span></button>
        </div>
        <div id="admin-nav-wrap" class="nav-group hidden">
          <span class="nav-label">Plataforma</span>
          <button data-view="admin" id="admin-nav"><span class="nav-icon">⚙</span><span>Administração</span></button>
        </div>
      </nav>

      <div class="aside-footer">
        <div class="user-card">
          <div class="avatar">M</div>
          <div class="user-copy"><strong id="user-email"></strong><span id="user-role"></span></div>
        </div>
        <button id="logout" class="ghost">Sair</button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="page-heading">
          <div class="eyebrow">Flash Pag <span class="dot">•</span> Beta</div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle">Visão operacional</p>
        </div>
        <div class="topbar-actions">
          <label class="org-switcher"><span>Organização</span><select id="org-select"></select></label>
        </div>
      </header>
      <div id="flash" class="flash hidden"></div>
      <div id="content" class="content"></div>
    </section>
  </div>

  <div id="drawer-layer" class="drawer-layer hidden" aria-hidden="true">
    <button id="drawer-backdrop" class="drawer-backdrop" aria-label="Fechar"></button>
    <aside class="drawer" role="dialog" aria-modal="true">
      <div class="drawer-head"><h2 id="drawer-title">Detalhes</h2><button id="drawer-close" class="icon-button" type="button" aria-label="Fechar">×</button></div>
      <div id="drawer-content" class="drawer-content"></div>
    </aside>
  </div>

  <script src="/console/app.js"></script>
  <script src="/console/product.js"></script>
  <script src="/console/product-v2.js"></script>
  <script src="/console/developer.js"></script>
  <script src="/console/ui-runtime.js"></script>
  <script src="/console/product-v3.js"></script>
  <script src="/console/revolut-foundation.js"></script>
  <script src="/console/revolut-operations.js"></script>
  <script src="/console/revolut-workspace.js"></script>
  <script src="/console/revolut-structure.js"></script>
</body>
</html>
