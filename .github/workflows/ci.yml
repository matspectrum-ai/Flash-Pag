name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashpag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d flashpag_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/flashpag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: gofmt -w ./cmd ./internal && git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - run: go test ./...
      - run: go vet ./...
