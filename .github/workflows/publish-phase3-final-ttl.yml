name: publish-phase3-final-ttl

on:
  push:
    branches:
      - benchmark/publish-phase3-2610afd

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 3 final head
        uses: actions/checkout@v4
        with:
          ref: 2610afd62cc6b41418241514c32f92e8882bb7e9

      - name: Build exact read-only preview image
        run: |
          set -euo pipefail
          IMAGE="ttl.sh/flashpag-phase3-2610afd-20260906:24h"
          docker build --build-arg VITE_PREVIEW_READ_ONLY=true -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Published $IMAGE"
