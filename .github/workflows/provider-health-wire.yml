name: Wire provider health checks

on:
  push:
    branches:
      - feat/minimal-pix-gateway
    paths:
      - .github/workflows/provider-health-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/minimal-pix-gateway
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Patch source
        run: python3 .github/scripts/wire_provider_health.py
      - name: Format
        run: gofmt -w ./cmd ./internal
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Commit source
        run: |
          git config user.name "flashpag-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/provider-health-wire.yml .github/scripts/wire_provider_health.py
          git add internal
          git commit -m "feat: add read-only provider health checks"
          git push origin HEAD:feat/minimal-pix-gateway
