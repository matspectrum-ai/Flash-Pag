name: apply-hardening
on:
  push:
    branches: [feat/minimal-pix-gateway]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/part-* | base64 -d > /tmp/update.txz
          xz -t /tmp/update.txz
          tar -xJf /tmp/update.txz -C .
          rm -rf .patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden tenant authorization and webhook delivery'
          git push origin HEAD:feat/minimal-pix-gateway
