name: bootstrap-source
on:
  push:
    branches: [feat/minimal-pix-gateway]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/flashpag-src.txz
          xz -t /tmp/flashpag-src.txz

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/flashpag-src.txz -C .
          test -f go.mod
          test -f cmd/flashpag/main.go
          test -f migrations/0001_init.sql
          test -f internal/provider/provider.go

      - name: Prepare source commit
        shell: bash
        run: |
          set -euo pipefail
          # GitHub App tokens cannot create/update workflow files. Keep the
          # bootstrap workflow untouched and install ci.yml via the connector
          # after the source commit lands.
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: build minimal multi-provider Pix gateway'

      - name: Push source commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/minimal-pix-gateway
