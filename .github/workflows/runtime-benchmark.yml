name: runtime-benchmark

on:
  push:
    branches:
      - benchmark/runtime-probes-20260906

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact Phase 3 Railway preview
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            label="$1"
            base="$2"
            echo "=== ${label} ==="

            health_status="$(curl -sS --max-time 30 -o "${label}-health.json" -w '%{http_code}' "${base}/healthz")"
            health_time="$(curl -sS --max-time 30 -o /dev/null -w '%{time_total}' "${base}/healthz")"
            echo "health status=${health_status} time_total=${health_time}"
            cat "${label}-health.json"; echo
            test "${health_status}" = "200"
            grep -q '"preview_read_only":true' "${label}-health.json"

            for path in /app/ /app/platform/finance /app/platform/merchants/00000000-0000-4000-8000-000000000000; do
              status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${base}${path}")"
              elapsed="$(curl -sS --max-time 30 -o /dev/null -w '%{time_total}' "${base}${path}")"
              echo "${path} status=${status} time_total=${elapsed}"
              test "${status}" = "200"
            done

            mutation_status="$(curl -sS --max-time 30 -o "${label}-mutation.json" -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "${base}/console/register")"
            mutation_time="$(curl -sS --max-time 30 -o /dev/null -w '%{time_total}' -H 'Content-Type: application/json' -d '{}' "${base}/console/register")"
            echo "mutation status=${mutation_status} time_total=${mutation_time}"
            cat "${label}-mutation.json"; echo
            test "${mutation_status}" = "423"
            grep -q '"code":"preview_read_only"' "${label}-mutation.json"
          }

          probe railway_exact https://flash-pag-phase3-dd630-preview-production.up.railway.app
          probe railway_stable https://flash-pag-react-preview-production.up.railway.app
